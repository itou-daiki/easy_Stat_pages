{% extends "base.html" %}

{% block title %}探索的データ分析（EDA） - easyStat{% endblock %}

{% block content %}
<div class="container">
    <h1 class="mb-4"><i class="fas fa-search me-2"></i>探索的データ分析（EDA）</h1>
    <p class="lead">データの特徴や傾向を視覚的に理解するための基本的な分析を行います。</p>

    <!-- File Upload Section -->
    <div class="card mb-4">
        <div class="card-header bg-primary text-white">
            <i class="fas fa-upload me-2"></i>データのアップロード
        </div>
        <div class="card-body">
            <div class="row">
                <div class="col-md-8">
                    <div class="mb-3">
                        <label for="fileInput" class="form-label">CSVまたはExcelファイルを選択してください</label>
                        <input type="file" class="form-control" id="fileInput" accept=".csv,.xlsx,.xls">
                        <small class="text-muted">最大ファイルサイズ: 16MB</small>
                    </div>
                </div>
                <div class="col-md-4">
                    <label class="form-label">デモデータ</label>
                    <button type="button" class="btn btn-outline-secondary w-100" id="useDemoBtn">
                        <i class="fas fa-database me-2"></i>デモデータを使用
                    </button>
                </div>
            </div>
            <div id="uploadStatus" class="alert alert-info d-none mt-3" role="alert"></div>
        </div>
    </div>

    <!-- Data Preview Section -->
    <div id="dataPreviewSection" class="card mb-4 d-none">
        <div class="card-header bg-success text-white">
            <i class="fas fa-table me-2"></i>データプレビュー
        </div>
        <div class="card-body">
            <div id="dataInfo" class="mb-3"></div>
            <div class="table-responsive">
                <table class="table table-striped table-sm" id="previewTable">
                    <thead></thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Analysis Settings Section -->
    <div id="analysisSection" class="card mb-4 d-none">
        <div class="card-header bg-info text-white">
            <i class="fas fa-cog me-2"></i>分析設定
        </div>
        <div class="card-body">
            <div class="mb-3">
                <label for="columnSelect" class="form-label">分析する変数を選択してください</label>
                <select class="form-select" id="columnSelect">
                    <option value="">-- 変数を選択 --</option>
                </select>
            </div>
            <button type="button" class="btn btn-primary" id="analyzeBtn">
                <i class="fas fa-chart-bar me-2"></i>EDA分析を実行
            </button>
        </div>
    </div>

    <!-- Results Section -->
    <div id="resultsSection" class="d-none">
        <!-- Statistics Summary -->
        <div class="card mb-4">
            <div class="card-header bg-dark text-white">
                <i class="fas fa-calculator me-2"></i>記述統計量
            </div>
            <div class="card-body">
                <div id="statisticsTable"></div>
            </div>
        </div>

        <!-- Histogram -->
        <div class="card mb-4">
            <div class="card-header bg-dark text-white">
                <i class="fas fa-chart-bar me-2"></i>ヒストグラム
            </div>
            <div class="card-body">
                <div id="histogramPlot"></div>
            </div>
        </div>

        <!-- Box Plot -->
        <div class="card mb-4">
            <div class="card-header bg-dark text-white">
                <i class="fas fa-box me-2"></i>箱ひげ図
            </div>
            <div class="card-body">
                <div id="boxPlot"></div>
            </div>
        </div>

        <!-- Normality Test -->
        <div class="card mb-4">
            <div class="card-header bg-dark text-white">
                <i class="fas fa-vial me-2"></i>正規性検定
            </div>
            <div class="card-body">
                <div id="normalityTest"></div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
// (ここに相関分析ページと同様のJavaScriptコードを実装)
// ファイルアップロード、デモデータ読み込み、EDA分析の実行処理
// 簡略化のため、基本的な構造のみ提示
let currentData = null;

document.getElementById('fileInput').addEventListener('change', async (e) => {
    // アップロード処理（correlation.htmlと同様）
});

document.getElementById('useDemoBtn').addEventListener('click', async () => {
    // デモデータ読み込み（correlation.htmlと同様）
});

document.getElementById('analyzeBtn').addEventListener('click', async () => {
    const column = document.getElementById('columnSelect').value;
    if (!column) {
        alert('変数を選択してください');
        return;
    }

    try {
        const response = await fetch('/api/eda/analyze', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ column })
        });

        const result = await response.json();
        if (response.ok) {
            displayResults(result);
        } else {
            alert(`エラー: ${result.error}`);
        }
    } catch (error) {
        alert(`エラー: ${error.message}`);
    }
});

function displayResults(results) {
    // 記述統計量の表示
    const stats = results.statistics;
    document.getElementById('statisticsTable').innerHTML = `
        <table class="table table-bordered">
            <tr><th>項目</th><th>値</th></tr>
            <tr><td>データ数</td><td>${stats.count}</td></tr>
            <tr><td>平均値</td><td>${stats.mean.toFixed(4)}</td></tr>
            <tr><td>標準偏差</td><td>${stats.std.toFixed(4)}</td></tr>
            <tr><td>最小値</td><td>${stats.min.toFixed(4)}</td></tr>
            <tr><td>第1四分位数</td><td>${stats.q1.toFixed(4)}</td></tr>
            <tr><td>中央値</td><td>${stats.median.toFixed(4)}</td></tr>
            <tr><td>第3四分位数</td><td>${stats.q3.toFixed(4)}</td></tr>
            <tr><td>最大値</td><td>${stats.max.toFixed(4)}</td></tr>
            <tr><td>歪度</td><td>${stats.skewness.toFixed(4)}</td></tr>
            <tr><td>尖度</td><td>${stats.kurtosis.toFixed(4)}</td></tr>
        </table>
    `;

    // ヒストグラムの表示
    const histData = [{
        x: results.histogram_data,
        type: 'histogram',
        marker: { color: '#6366f1' }
    }];
    Plotly.newPlot('histogramPlot', histData, {
        title: 'ヒストグラム',
        xaxis: { title: results.column },
        yaxis: { title: '度数' }
    });

    // 箱ひげ図の表示
    const boxData = [{
        y: results.histogram_data,
        type: 'box',
        name: results.column,
        marker: { color: '#8b5cf6' }
    }];
    Plotly.newPlot('boxPlot', boxData, {
        title: '箱ひげ図',
        yaxis: { title: results.column }
    });

    // 正規性検定の結果
    const normTest = results.normality_test;
    document.getElementById('normalityTest').innerHTML = `
        <div class="alert ${normTest.is_normal ? 'alert-success' : 'alert-warning'}">
            <h5>${normTest.test}検定</h5>
            <p>検定統計量: ${normTest.statistic ? normTest.statistic.toFixed(4) : 'N/A'}</p>
            <p>p値: ${normTest.p_value ? normTest.p_value.toFixed(4) : 'N/A'}</p>
            <p><strong>結果: ${normTest.is_normal ? '正規分布に従う' : '正規分布に従わない'}</strong></p>
        </div>
    `;

    document.getElementById('resultsSection').classList.remove('d-none');
}
</script>
{% endblock %}
